
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>المدونة</title></head>
<body>
    <div id="blog-content">جاري التحميل...</div>

    <script>
        // الرابط المباشر
        const GIST_URL = 'https://gist.githubusercontent.com/Gamingmonster2/88c35a33f7886600d2f43f51f4f8601c/raw/database.json';

        async function loadPosts() {
            try {
                // إضافة متغير عشوائي لمنع الكاش (Cache Buster)
                const response = await fetch(GIST_URL + '?t=' + new Date().getTime());
                const data = await response.json();
                
                const container = document.getElementById('blog-content');
                
                // التأكد من وجود مصفوفة الـ posts
                if (data && data.posts) {
                    container.innerHTML = data.posts.map(post => `
                        <article>
                            <h2>${post.title}</h2>
                            <p>${post.content}</p>
                        </article>
                    `).join('');
                } else {
                    container.innerHTML = 'خطأ: صيغة البيانات غير مطابقة. محتوى الملف: ' + JSON.stringify(data);
                }
            } catch (err) {
                document.getElementById('blog-content').innerText = 'خطأ في الاتصال بالبيانات: ' + err;
            }
        }
        loadPosts();
    </script>
</body>
</html>
